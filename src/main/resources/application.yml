server:
  port: ${PORT:8080}

spring:
  application:
    name: meridian
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/meridian}
    username: ${DATABASE_USER:meridian}
    password: ${DATABASE_PASSWORD:meridian}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
