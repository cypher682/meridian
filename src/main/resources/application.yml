server:
  port: ${PORT:8080}

spring:
  application:
    name: meridian
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/meridian}
    username: ${DATABASE_USER:meridian}
    password: ${DATABASE_PASSWORD:meridian}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8084/realms/meridian}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8084/realms/meridian/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
