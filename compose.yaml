name: meridian

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-meridian}
      DATABASE_USER: ${POSTGRES_USER:-meridian}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
    ports:
      - "8083:8080"

volumes:
  pgdata:
